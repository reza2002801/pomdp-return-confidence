[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "returnbounds"
version = "0.1.0"
description = "Finite-horizon MGF and polynomial return confidence levels"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["returnbounds*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
